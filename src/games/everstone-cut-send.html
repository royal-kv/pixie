<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f1e8" />
  <title>Everstone — Gem Cutting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* Everstone Cutting Studio — luxury jewelry × premium casual */

:root {
  --cream: #f7f1e8;
  --cream-deep: #efe6d8;
  --paper: rgba(255, 252, 247, 0.86);
  --ink: #2c2620;
  --ink-soft: #6a5f54;
  --gold: #b8923e;
  --gold-bright: #d4a84b;
  --gold-pale: #f0e0b8;
  --line: rgba(184, 146, 62, 0.28);
  --shadow: 0 8px 28px rgba(60, 42, 20, 0.1);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-ui: "Outfit", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #fff9f0 0%, transparent 55%),
    radial-gradient(ellipse 80% 50% at 100% 100%, rgba(212, 168, 75, 0.14), transparent 50%),
    radial-gradient(ellipse 60% 40% at 0% 80%, rgba(180, 150, 120, 0.12), transparent 45%),
    linear-gradient(180deg, #faf4eb 0%, var(--cream) 40%, #f0e8dc 100%);
}

.app {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  max-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 10px 12px calc(10px + var(--safe-bottom));
  position: relative;
}

/* —— Top —— */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
  margin-bottom: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #fff6e0, transparent 40%),
    conic-gradient(from 210deg, #c9a24a, #f0e0b8, #8a6a2a, #d4a84b);
  box-shadow: 0 2px 8px rgba(184, 146, 62, 0.35);
  position: relative;
  clip-path: polygon(50% 4%, 92% 28%, 78% 92%, 22% 92%, 8% 28%);
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  clip-path: inherit;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.16em;
  color: var(--ink);
}
.brand-sub {
  font-size: 8px;
  letter-spacing: 0.22em;
  color: var(--gold);
  font-weight: 600;
  margin-top: 3px;
}

.top-stats {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px;
  font-weight: 600;
  font-size: 13px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}

.coin-icon {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(145deg, #f0d78a, #c9962e);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  font-size: 15px;
  cursor: pointer;
  box-shadow: var(--shadow);
  display: grid;
  place-items: center;
}
.icon-btn.muted { opacity: 0.55; }
.icon-btn:active { transform: scale(0.94); }

/* —— Target card —— */
.target-card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px 8px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
  overflow: hidden;
}
.target-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(240, 224, 184, 0.35), transparent 55%);
  pointer-events: none;
}
.target-label {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 6px;
  position: relative;
}
.target-body {
  display: flex;
  gap: 12px;
  align-items: center;
  position: relative;
}
.target-preview {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  border-radius: 14px;
  background: linear-gradient(160deg, #fffdf8, var(--cream-deep));
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
}
.target-preview svg { width: 40px; height: 40px; }
.target-info { flex: 1; min-width: 0; }
.target-title {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.15;
  color: var(--ink);
}
.target-title span { color: var(--gold); letter-spacing: 0.02em; }

.stone-line {
  margin: 0 0 6px;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}
.stone-line strong {
  color: var(--ink);
  font-weight: 600;
  letter-spacing: 0.08em;
}

.material-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-soft);
}
.material-row strong {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  min-width: 2.6em;
}
.material-bar {
  flex: 1;
  height: 5px;
  border-radius: 99px;
  background: rgba(44, 38, 32, 0.08);
  overflow: hidden;
}
.material-fill {
  height: 100%;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--gold-bright));
  transition: width 0.25s ease;
}

.meta-chips {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  position: relative;
  flex-wrap: wrap;
}
.chip {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(184, 146, 62, 0.12);
  color: var(--gold);
  border: 1px solid rgba(184, 146, 62, 0.25);
}
.chip.soft {
  background: rgba(44, 38, 32, 0.04);
  color: var(--ink-soft);
  border-color: rgba(44, 38, 32, 0.08);
}
.chip.soft strong { color: var(--ink); }

/* —— Stage —— */
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  margin: 10px 0;
  border-radius: 22px;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, rgba(255,255,255,0.55), transparent 70%),
    linear-gradient(180deg, rgba(255,250,242,0.7), rgba(240,232,220,0.55));
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), var(--shadow);
  overflow: hidden;
  touch-action: none;
  cursor: crosshair;
}
.stage.mode-rotate { cursor: grab; }
.stage.mode-rotate.dragging { cursor: grabbing; }
.stage.mode-zoom { cursor: ns-resize; }
.stage.mode-straight { cursor: crosshair; }

.cutter-cursor.straight-mode {
  border-radius: 4px;
  width: 48px;
  height: 10px;
  margin: -5px 0 0 -24px;
}
.cutter-cursor.straight-mode::after {
  width: 36px;
  height: 2px;
  border-radius: 1px;
}

.stage-glow {
  position: absolute;
  inset: 18% 12%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212, 168, 75, 0.18), transparent 65%);
  pointer-events: none;
  filter: blur(8px);
}

#gemCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.fx-layer, .toast-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 5;
}

.stage-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 12px;
  margin: 0;
  text-align: center;
  font-size: 11px;
  color: var(--ink-soft);
  opacity: 0.7;
  letter-spacing: 0.04em;
  pointer-events: none;
  transition: opacity 0.4s;
  z-index: 4;
}
.stage-hint.hide { opacity: 0; }

.cutter-cursor {
  position: absolute;
  width: 44px;
  height: 44px;
  margin: -22px 0 0 -22px;
  border-radius: 50%;
  border: 2px solid rgba(184, 146, 62, 0.55);
  background:
    radial-gradient(circle at 40% 35%, rgba(255,255,255,0.7), transparent 50%),
    linear-gradient(145deg, rgba(240, 224, 184, 0.5), rgba(184, 146, 62, 0.25));
  box-shadow: 0 4px 14px rgba(60, 42, 20, 0.18);
  pointer-events: none;
  z-index: 6;
  display: grid;
  place-items: center;
}
.cutter-cursor::after {
  content: "";
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, #8a6a2a, #d4a84b);
  box-shadow: 0 0 6px rgba(212, 168, 75, 0.5);
}

.precision-banner {
  position: absolute;
  left: 50%;
  top: 14%;
  transform: translateX(-50%);
  z-index: 7;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-shadow: 0 2px 12px rgba(255, 250, 240, 0.9);
  pointer-events: none;
  white-space: nowrap;
}
.precision-banner.pop {
  animation: bannerPop 0.7s cubic-bezier(0.22, 1.4, 0.36, 1);
}
.precision-banner.warn { color: #a06050; }
@keyframes bannerPop {
  0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
  30% { opacity: 1; transform: translateX(-50%) scale(1.08); }
  100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-12px); }
}

.frag {
  position: absolute;
  width: 6px;
  height: 6px;
  margin: -3px;
  clip-path: polygon(50% 0%, 100% 40%, 80% 100%, 20% 100%, 0% 40%);
  background: linear-gradient(145deg, #fff, #c8d8ec);
  box-shadow: 0 0 6px rgba(200, 220, 240, 0.8);
  animation: fragFly 0.55s ease-out forwards;
  pointer-events: none;
}
@keyframes fragFly {
  to {
    transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.2);
    opacity: 0;
  }
}

.spark {
  position: absolute;
  width: 4px;
  height: 4px;
  margin: -2px;
  border-radius: 50%;
  background: #fff8e8;
  box-shadow: 0 0 8px #f0d78a;
  animation: sparkFly 0.4s ease-out forwards;
}
@keyframes sparkFly {
  to {
    transform: translate(var(--dx), var(--dy)) scale(0);
    opacity: 0;
  }
}

.toast {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  background: rgba(44, 38, 32, 0.88);
  color: #f7f1e8;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  animation: toastIn 1.1s ease forwards;
  white-space: nowrap;
}
@keyframes toastIn {
  0% { opacity: 0; transform: translate(-50%, 8px); }
  15% { opacity: 1; transform: translate(-50%, 0); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

.float-coin {
  position: absolute;
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  text-shadow: 0 1px 0 rgba(255,255,255,0.8);
  animation: floatUp 0.85s ease-out forwards;
  pointer-events: none;
  white-space: nowrap;
}
@keyframes floatUp {
  to { transform: translateY(-30px); opacity: 0; }
}

/* —— Dock —— */
.dock {
  flex-shrink: 0;
  padding-top: 2px;
}
.tool-row {
  display: flex;
  gap: 6px;
}
.tool {
  flex: 1;
  min-width: 0;
  min-height: 54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 7px 2px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--shadow);
  cursor: pointer;
  color: var(--ink);
  font-family: inherit;
}
.tool:active { transform: scale(0.96); }
.tool.active {
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 2px rgba(212, 168, 75, 0.35);
  background: linear-gradient(180deg, #fffdf8, #f5ebe0);
}
.tool.accent {
  background: linear-gradient(135deg, #a8842e, #d4a84b);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 18px rgba(184, 146, 62, 0.35);
}
.tool.accent .tool-name { color: #fff; }
.tool-name {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-soft);
}
.tool-icon {
  width: 22px;
  height: 22px;
  position: relative;
}
.cut-icon {
  background: linear-gradient(90deg, #8a6a2a, #d4a84b);
  clip-path: polygon(10% 45%, 70% 20%, 90% 35%, 40% 70%, 15% 60%);
  box-shadow: 0 0 6px rgba(212, 168, 75, 0.4);
}
.straight-icon {
  width: 20px;
  height: 3px;
  margin: 9px auto;
  border-radius: 2px;
  background: linear-gradient(90deg, #8a6a2a, #d4a84b);
  box-shadow: 0 0 0 1px rgba(184, 146, 62, 0.25);
  position: relative;
}
.straight-icon::before,
.straight-icon::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold-bright);
  top: -1px;
}
.straight-icon::before { left: -2px; }
.straight-icon::after { right: -2px; }
.rotate-icon {
  border: 2.5px solid var(--gold);
  border-radius: 50%;
  border-top-color: transparent;
}
.rotate-icon::after {
  content: "";
  position: absolute;
  right: -1px;
  top: 1px;
  border: 4px solid transparent;
  border-bottom-color: var(--gold);
  transform: rotate(45deg);
}
.zoom-icon {
  border: 2px solid var(--gold);
  border-radius: 50%;
  width: 16px;
  height: 16px;
  margin: 0 auto;
}
.zoom-icon::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 2px;
  background: var(--gold);
  right: -2px;
  bottom: 2px;
  transform: rotate(45deg);
  border-radius: 1px;
}
.finish-icon {
  width: 18px;
  height: 18px;
  background: linear-gradient(145deg, #fff, #d4e4f4);
  clip-path: polygon(50% 0%, 95% 30%, 78% 95%, 22% 95%, 5% 30%);
  margin: 0 auto;
  box-shadow: 0 0 8px rgba(255,255,255,0.5);
}

/* —— Overlays —— */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(40, 32, 24, 0.48);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
  backdrop-filter: blur(5px);
}
.overlay[hidden] { display: none !important; }

.reveal-card, .picker-card {
  width: min(360px, 100%);
  background: var(--cream);
  border-radius: 22px;
  padding: 22px 18px 18px;
  border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(40, 30, 20, 0.28);
  text-align: center;
  animation: cardIn 0.45s cubic-bezier(0.22, 1.3, 0.36, 1);
}
@keyframes cardIn {
  from { transform: scale(0.88) translateY(12px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.reveal-gem {
  width: 120px;
  height: 120px;
  margin: 0 auto 10px;
  position: relative;
}
.reveal-gem canvas {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 10px 24px rgba(60, 42, 20, 0.2));
}
.reveal.perfect .reveal-gem {
  animation: perfectPulse 1.4s ease-in-out infinite;
}
@keyframes perfectPulse {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(212, 168, 75, 0.35)); }
  50% { filter: drop-shadow(0 0 28px rgba(212, 168, 75, 0.7)); }
}

.reveal-kicker {
  margin: 0;
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--gold);
  font-weight: 600;
}
.reveal-title {
  margin: 4px 0 2px;
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.reveal-stone {
  margin: 0 0 8px;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ink-soft);
  font-weight: 600;
}
.reveal-grade {
  margin: 0 0 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.06em;
}
.reveal-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.reveal-stats div {
  background: rgba(255, 252, 247, 0.8);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 4px;
}
.reveal-stats span {
  display: block;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 2px;
}
.reveal-stats strong {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
}
.reveal-value {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: 0.08em;
}
.reveal-value strong {
  color: var(--gold);
  font-size: 18px;
}
.reveal-rewards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-bottom: 14px;
  min-height: 24px;
}
.reward-chip {
  font-size: 10px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(184, 146, 62, 0.12);
  color: var(--gold);
  animation: rewardIn 0.4s ease backwards;
}
@keyframes rewardIn {
  from { opacity: 0; transform: translateY(6px); }
}

.btn-primary, .btn-ghost {
  border: none;
  border-radius: 14px;
  padding: 14px 16px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
}
.btn-primary {
  background: linear-gradient(135deg, #a8842e, #d4a84b);
  color: #fff;
  box-shadow: 0 8px 20px rgba(184, 146, 62, 0.35);
  letter-spacing: 0.08em;
}
.btn-primary:active { transform: scale(0.98); }
.btn-large { margin-bottom: 8px; min-height: 52px; font-size: 15px; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-soft);
}

.picker-card h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 24px;
}
.picker-sub {
  margin: 0 0 14px;
  color: var(--ink-soft);
  font-size: 13px;
}
.shape-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.shape-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255, 252, 247, 0.75);
  cursor: pointer;
  font-family: inherit;
  color: var(--ink);
  min-height: 88px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.shape-option:active { transform: scale(0.97); }
.shape-option.selected,
.shape-option:hover {
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 2px rgba(212, 168, 75, 0.3);
  background: linear-gradient(180deg, #fffdf8, #f5ebe0);
}
.shape-option svg { width: 36px; height: 36px; }
.shape-option span {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}

/* —— Responsive —— */
@media (max-width: 360px) {
  .app { padding: 8px 8px calc(8px + var(--safe-bottom)); }
  .target-title { font-size: 15px; }
  .target-preview { width: 44px; height: 44px; }
  .tool { min-height: 52px; }
  .reveal-title { font-size: 22px; }
}

@media (min-width: 390px) {
  .target-title { font-size: 18px; }
}

@media (min-height: 780px) {

const SEGMENTS = 64;

/** Gemstone materials — colors drive rendering & value */
const STONE_DEFS = [

function getStone(id) {
  return STONE_DEFS.find((s) => s.id === id) || STONE_DEFS[0];
}

function pickStone(roundsCompleted, excludeId) {
  const maxRarity = roundsCompleted === 0
    ? 1
    : Math.min(3, 1 + Math.floor(roundsCompleted / 3));
  const pool = STONE_DEFS.filter(
    (s) => s.rarity <= maxRarity && s.id !== excludeId
  );
  const list = pool.length ? pool : STONE_DEFS.filter((s) => s.rarity <= maxRarity);
  return list[Math.floor(Math.random() * list.length)] || STONE_DEFS[0];
}

const CUT_DEFS = [
  {
    id: 'round',
    name: 'ROUND BRILLIANT',
    short: 'ROUND',
    difficulty: 1,
    /** Radial profile 0..1 for angles 0..2π */
    profile: () => Array(SEGMENTS).fill(1),
  },
  {
    id: 'oval',
    name: 'OVAL',
    short: 'OVAL',
    difficulty: 2,
    profile: () => polarFromParam((t) => {
      const a = 1.0, b = 0.72;
      const c = Math.cos(t), s = Math.sin(t);
      return (a * b) / Math.sqrt((b * c) ** 2 + (a * s) ** 2);
    }),
  },
  {
    id: 'emerald',
    name: 'EMERALD',
    short: 'EMERALD',
    difficulty: 2,
    profile: () => polarFromRect(0.78, 1.0, 0.18),
  },
  {
    id: 'princess',
    name: 'PRINCESS',
    short: 'PRINCESS',
    difficulty: 2,
    profile: () => polarFromRect(0.92, 0.92, 0.02),
  },
  {
    id: 'pear',
    name: 'PEAR',
    short: 'PEAR',
    difficulty: 3,
    profile: () => polarFromParam((t) => {
      // Pointed top, rounded bottom
      const u = (t + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
      const n = u / (Math.PI * 2);
      if (n < 0.5) {
        // bottom half — round
        const a = Math.sin(n * Math.PI * 2);
        return 0.55 + 0.45 * Math.abs(a);
      }
      // top — taper to point
      const p = (n - 0.5) * 2;
      const side = Math.sin(p * Math.PI);
      return 0.22 + 0.78 * Math.pow(side, 0.65);
    }),
  },
  {
    id: 'marquise',
    name: 'MARQUISE',
    short: 'MARQUISE',
    difficulty: 3,
    profile: () => polarFromParam((t) => {
      const c = Math.cos(t), s = Math.sin(t);
      const a = 1.05, b = 0.52;
      return (a * b) / Math.sqrt((b * c) ** 2 + (a * s) ** 2);
    }),
  },
  {
    id: 'cushion',
    name: 'CUSHION',
    short: 'CUSHION',
    difficulty: 3,
    profile: () => polarFromRect(0.88, 0.88, 0.28),
  },
  {
    id: 'radiant',
    name: 'RADIANT',
    short: 'RADIANT',
    difficulty: 4,
    profile: () => polarFromRect(0.82, 0.98, 0.22),
  },
];

function polarFromParam(fn) {
  const out = [];
  let max = 0;
  for (let i = 0; i < SEGMENTS; i++) {
    const t = (i / SEGMENTS) * Math.PI * 2;
    const r = fn(t);
    out.push(r);
    if (r > max) max = r;
  }
  return out.map((r) => r / max);
}

/** Rounded rectangle / octagon via ray–polygon intersect */
function polarFromRect(hw, hh, corner) {
  const pts = roundedRectPoints(hw, hh, corner);
  return polarFromPolygon(pts);
}

function roundedRectPoints(hw, hh, corner) {
  const c = Math.min(corner, hw * 0.9, hh * 0.9);
  // Octagon-ish: cut corners
  return [
    { x: hw - c, y: -hh },
    { x: hw, y: -hh + c },
    { x: hw, y: hh - c },
    { x: hw - c, y: hh },
    { x: -hw + c, y: hh },
    { x: -hw, y: hh - c },
    { x: -hw, y: -hh + c },
    { x: -hw + c, y: -hh },
  ];
}

function polarFromPolygon(pts) {
  const out = [];
  let max = 0;
  for (let i = 0; i < SEGMENTS; i++) {
    const ang = (i / SEGMENTS) * Math.PI * 2 - Math.PI / 2;
    const dx = Math.cos(ang);
    const dy = Math.sin(ang);
    const r = rayPolyHit(0, 0, dx, dy, pts);
    out.push(r);
    if (r > max) max = r;
  }
  return out.map((r) => r / (max || 1));
}

function rayPolyHit(ox, oy, dx, dy, pts) {
  let best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % pts.length];
    const hit = raySeg(ox, oy, dx, dy, a.x, a.y, b.x, b.y);
    if (hit != null && hit > 0 && hit < best) best = hit;
  }
  return best === Infinity ? 1 : best;
}

function raySeg(ox, oy, dx, dy, x1, y1, x2, y2) {
  const ex = x2 - x1, ey = y2 - y1;
  const det = dx * ey - dy * ex;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((x1 - ox) * ey - (y1 - oy) * ex) / det;
  const u = ((x1 - ox) * dy - (y1 - oy) * dx) / det;
  if (t >= 0 && u >= 0 && u <= 1) return t;
  return null;
}

function getCut(id) {
  return CUT_DEFS.find((c) => c.id === id) || CUT_DEFS[0];
}

function buildTargetRadii(cut, scale = 1) {
  const base = cut.profile();
  return base.map((r) => r * scale);
}

/**
 * Generate a rough diamond larger than the target.
 * easyPad: extra material (higher = easier first cuts)
 */
function buildRoughRadii(targetRadii, opts = {}) {
  const pad = opts.pad ?? 0.28;
  const noise = opts.noise ?? 0.08;
  const asymmetry = opts.asymmetry ?? 0.04;
  return targetRadii.map((t, i) => {
    const ang = (i / SEGMENTS) * Math.PI * 2;
    const wobble = Math.sin(ang * 3.2 + 0.7) * noise
      + Math.cos(ang * 5.1) * noise * 0.6
      + (Math.random() - 0.5) * noise * 0.5;
    const asym = Math.sin(ang + 1.2) * asymmetry;
    return t * (1 + pad + wobble + asym);
  });
}

function radiiToPath(radii, cx, cy, scale) {
  let d = '';
  for (let i = 0; i < radii.length; i++) {
    const ang = (i / radii.length) * Math.PI * 2 - Math.PI / 2;
    const r = radii[i] * scale;
    const x = cx + Math.cos(ang) * r;
    const y = cy + Math.sin(ang) * r;
    d += i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
  }
  return d + ' Z';
}

function areaOfRadii(radii) {
  // Approximate polygon area via triangles from center
  let area = 0;
  const n = radii.length;
  for (let i = 0; i < n; i++) {
    const r0 = radii[i];
    const r1 = radii[(i + 1) % n];
    const dAng = (Math.PI * 2) / n;
    area += 0.5 * r0 * r1 * Math.sin(dAng);
  }
  return area;
}

function shapeAccuracy(current, target) {
  let err = 0;
  let denom = 0;
  for (let i = 0; i < current.length; i++) {
    const t = target[i];
    const c = current[i];
    err += Math.abs(c - t);
    denom += t;
  }
  const meanAbs = err / (denom || 1);
  // Convert to 0..100 — generous for casual play
  return clamp(100 * (1 - meanAbs * 1.35), 0, 100);
}

function symmetryScore(radii) {
  const n = radii.length;
  let err = 0;
  let denom = 0;
  for (let i = 0; i < n; i++) {
    const j = (i + n / 2) % n;
    err += Math.abs(radii[i] - radii[j]);
    denom += radii[i] + radii[j];
  }
  const mean = err / ((denom / n) || 1);
  return clamp(100 * (1 - mean * 1.1), 0, 100);
}

/** Mirror left-right symmetry for pear etc. */
function bilateralSymmetry(radii) {
  const n = radii.length;
  let err = 0;
  let denom = 0;
  for (let i = 0; i < n; i++) {
    // Reflect across vertical axis (angle 0 at top): index mirror
    const mirror = (n - i) % n;
    err += Math.abs(radii[i] - radii[mirror]);
    denom += radii[i];
  }
  const mean = err / (denom || 1);
  return clamp(100 * (1 - mean * 1.2), 0, 100);
}

function materialRetained(current, initial) {
  const a0 = areaOfRadii(initial);
  const a1 = areaOfRadii(current);
  if (a0 <= 0) return 0;
  return clamp((a1 / a0) * 100, 0, 100);
}

function cutQuality(shape, sym, mat) {
  // Reward precision; lightly penalize over-cutting via material weight
  return clamp(shape * 0.5 + sym * 0.25 + mat * 0.25, 0, 100);
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function angleIndex(angle, n = SEGMENTS) {
  // angle from -π..π or 0..2π, 0 = top (-π/2 in math coords used elsewhere)
  let a = angle + Math.PI / 2;
  a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  return Math.floor((a / (Math.PI * 2)) * n) % n;
}

function miniShapeSvg(cutId, stoneId) {
  const cut = getCut(cutId);
  const stone = getStone(stoneId || STONE_DEFS[0].id);
  const radii = buildTargetRadii(cut, 1);
  const cx = 20, cy = 20, scale = 16;
  const d = radiiToPath(radii, cx, cy, scale);
  const uid = `sg-${cutId}-${stone.id}`;
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${stone.colors.hi}"/>
        <stop offset="50%" stop-color="${stone.colors.mid}"/>
        <stop offset="100%" stop-color="${stone.colors.deep}"/>
      </linearGradient>
    </defs>
    <path d="${d}" fill="url(#${uid})" stroke="${stone.colors.deep}" stroke-width="0.8" opacity="0.95"/>
    <g transform="translate(20 20) scale(0.55) translate(-20 -20)">
      <path d="${d}" fill="none" stroke="#fff" stroke-width="1" opacity="0.55"/>
    </g>
  </svg>`;
}

/**
 * Ray from origin at angle vs infinite line through (x1,y1)-(x2,y2).
 * Returns distance t along ray, or null.
 */
function rayLineIntersect(ang, x1, y1, x2, y2) {
  const dx = Math.cos(ang);
  const dy = Math.sin(ang);
  const ex = x2 - x1;
  const ey = y2 - y1;
  const det = dx * ey - dy * ex;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((x1) * ey - (y1) * ex) / det; // origin is (0,0)
  // Also require intersection falls on the segment's infinite line with sensible t
  if (t <= 0.02) return null;
  return t;
}

function lineSide(x, y, x1, y1, x2, y2) {
  return Math.sign((x2 - x1) * (y - y1) - (y2 - y1) * (x - x1)) || 0;
}

window.Shapes = {
  SEGMENTS,
  CUT_DEFS,
  STONE_DEFS,
  getCut,
  getStone,
  pickStone,
  buildTargetRadii,
  buildRoughRadii,
  radiiToPath,
  areaOfRadii,
  shapeAccuracy,
  symmetryScore,
  bilateralSymmetry,
  materialRetained,
  cutQuality,
  angleIndex,
  miniShapeSvg,
  rayLineIntersect,
  lineSide,
  clamp,
};


/** Web Audio synthesis for Everstone Cutting Studio */

const CutAudio = (() => {
  let ctx = null;
  let muted = false;

  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    return ctx;
  }

  async function unlock() {
    const c = getCtx();
    if (!c) return;
    if (c.state === 'suspended') {
      try { await c.resume(); } catch (_) { /* ignore */ }
    }
  }

  function isMuted() { return muted; }
  function setMuted(v) {
    muted = !!v;
    localStorage.setItem('everstone_cut_mute', muted ? '1' : '0');
  }
  function toggleMute() { setMuted(!muted); return muted; }
  function loadMute() {
    muted = localStorage.getItem('everstone_cut_mute') === '1';
  }

  function envGain(g, t, a = 0.01, d = 0.15, peak = 0.15) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }

  function tone(freq, dur, type = 'sine', peak = 0.12, delay = 0) {
    if (muted) return;
    const c = getCtx();
    if (!c || c.state !== 'running') return;
    const t = c.currentTime + delay;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    envGain(g, t, 0.01, dur, peak);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  function noiseBurst(dur = 0.06, peak = 0.035, hp = 2200) {
    if (muted) return;
    const c = getCtx();
    if (!c || c.state !== 'running') return;
    const n = c.createBufferSource();
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    n.buffer = buf;
    const g = c.createGain();
    const f = c.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = hp;
    const t = c.currentTime;
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f);
    f.connect(g);
    g.connect(c.destination);
    n.start(t);
    n.stop(t + dur);
  }

  /** Soft mechanical cutting wheel */
  function cut(intensity = 0.5) {
    noiseBurst(0.05 + intensity * 0.04, 0.028 + intensity * 0.02, 1800);
    tone(180 + intensity * 40, 0.04, 'triangle', 0.03);
    tone(2400 + Math.random() * 400, 0.03, 'sine', 0.02);
  }

  /** Tiny crystalline tink */
  function tink() {
    tone(2100 + Math.random() * 600, 0.05, 'sine', 0.045);
    tone(3200 + Math.random() * 400, 0.04, 'triangle', 0.025, 0.015);
  }

  function precision() {
    tone(880, 0.08, 'sine', 0.07);
    tone(1320, 0.1, 'sine', 0.05, 0.04);
    tone(1760, 0.08, 'triangle', 0.035, 0.08);
  }

  function perfectCut() {
    tone(523, 0.12, 'sine', 0.08);
    tone(659, 0.12, 'sine', 0.07, 0.05);
    tone(784, 0.14, 'sine', 0.07, 0.1);
    tone(1046, 0.18, 'triangle', 0.06, 0.16);
    tone(1568, 0.15, 'sine', 0.04, 0.24);
  }

  function tooDeep() {
    tone(220, 0.1, 'triangle', 0.05);
    tone(160, 0.12, 'sine', 0.035, 0.04);
  }

  function success() {
    tone(660, 0.1, 'sine', 0.08);
    tone(880, 0.12, 'sine', 0.06, 0.06);
    tone(1320, 0.14, 'triangle', 0.05, 0.12);
  }

  function master() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => {
      tone(f, 0.2, 'sine', 0.07 - i * 0.008, i * 0.07);
    });
    noiseBurst(0.12, 0.03, 3000);
  }

  function coins() {
    tone(988, 0.06, 'sine', 0.055);
    tone(1318, 0.07, 'sine', 0.045, 0.05);
    tone(1760, 0.09, 'triangle', 0.035, 0.1);
  }

  function tap() {
    tone(900, 0.05, 'sine', 0.05);
  }

  function reveal() {
    tone(440, 0.15, 'sine', 0.06);
    tone(660, 0.18, 'sine', 0.07, 0.08);
    tone(880, 0.2, 'triangle', 0.05, 0.16);
    tone(1320, 0.22, 'sine', 0.04, 0.24);
  }

  loadMute();

  return {
    unlock, isMuted, setMuted, toggleMute,
    cut, tink, precision, perfectCut, tooDeep,
    success, master, coins, tap, reveal,
  };
})();

/** Game state — endless diamond cutting rounds */

const STORAGE_KEY = 'everstone_cut_state';

class CutGame {
  constructor() {
    this.coins = 120;
    this.streak = 0;
    this.bestStreak = 0;
    this.personalBest = 0;
    this.roundsCompleted = 0;
    this.mode = 'cut'; // cut | straight | rotate | zoom
    this.phase = 'cutting'; // cutting | reveal | picker
    this.straightPreview = null;
    this.load();
    this.startRound('round'); // first: easy colorful gem, round brilliant
  }

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      this.coins = d.coins ?? 120;
      this.streak = d.streak ?? 0;
      this.bestStreak = d.bestStreak ?? 0;
      this.personalBest = d.personalBest ?? 0;
      this.roundsCompleted = d.roundsCompleted ?? 0;
    } catch (_) { /* ignore */ }
  }

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        coins: this.coins,
        streak: this.streak,
        bestStreak: this.bestStreak,
        personalBest: this.personalBest,
        roundsCompleted: this.roundsCompleted,
      }));
    } catch (_) { /* ignore */ }
  }

  /** Difficulty ramps with rounds — more demanding proportions */
  difficultyOpts() {
    const r = this.roundsCompleted;
    if (r === 0) {
      // First stone: close to round, responsive cuts — finishable in ~10s
      return { pad: 0.14, noise: 0.025, asymmetry: 0.01, cutStrength: 0.032 };
    }
    if (r < 3) {
      return { pad: 0.24, noise: 0.055, asymmetry: 0.03, cutStrength: 0.02 };
    }
    if (r < 8) {
      return { pad: 0.28, noise: 0.075, asymmetry: 0.04, cutStrength: 0.018 };
    }
    return { pad: 0.32, noise: 0.09, asymmetry: 0.05, cutStrength: 0.016 };
  }

  pickNextCutId(excludeId) {
    const r = this.roundsCompleted;
    const maxDiff = r === 0 ? 1 : Math.min(4, 1 + Math.floor(r / 2));
    const pool = Shapes.CUT_DEFS.filter(
      (c) => c.difficulty <= maxDiff && c.id !== excludeId
    );
    const list = pool.length ? pool : Shapes.CUT_DEFS;
    // Prefer variety
    return list[Math.floor(Math.random() * list.length)].id;
  }

  startRound(cutId, stoneId) {
    const id = cutId || this.pickNextCutId(this.cut?.id);
    this.cut = Shapes.getCut(id);
    this.stone = stoneId
      ? Shapes.getStone(stoneId)
      : Shapes.pickStone(this.roundsCompleted, this.stone?.id);
    const opts = this.difficultyOpts();
    this.cutStrength = opts.cutStrength;
    // Scale target into ~0.72 of max drawable radius units
    this.targetScale = 0.72;
    this.target = Shapes.buildTargetRadii(this.cut, this.targetScale);
    this.initial = Shapes.buildRoughRadii(this.target, opts);
    this.radii = this.initial.slice();
    this.rotation = 0;
    this.zoom = 1;
    this.phase = 'cutting';
    this.lastResult = null;
    this.cutsThisRound = 0;
    this.guideOpacity = 0.12;
    this.straightPreview = null;
  }

  materialPct() {
    return Math.round(Shapes.materialRetained(this.radii, this.initial));
  }

  liveScores() {
    const shape = Shapes.shapeAccuracy(this.radii, this.target);
    const sym = (
      Shapes.symmetryScore(this.radii) * 0.45
      + Shapes.bilateralSymmetry(this.radii) * 0.55
    );
    const mat = Shapes.materialRetained(this.radii, this.initial);
    const quality = Shapes.cutQuality(shape, sym, mat);
    return { shape, sym, mat, quality };
  }

  /**
   * Apply a cut at world-angle (stone-local, accounting for rotation).
   * depth: 0..1 how deep into the stone the cutter is.
   * Returns feedback: { removed, precision, tooDeep }
   */
  applyCut(localAngle, depthNorm, brushWidth = 3) {
    if (this.phase !== 'cutting') return null;

    const idx = Shapes.angleIndex(localAngle);
    const n = Shapes.SEGMENTS;
    let removed = 0;
    let closestDelta = Infinity;
    let overcut = false;

    for (let d = -brushWidth; d <= brushWidth; d++) {
      const i = (idx + d + n) % n;
      const falloff = 1 - Math.abs(d) / (brushWidth + 0.5);
      const targetR = this.target[i];
      const current = this.radii[i];

      // Desired radius after this cut — cutter depth maps toward center
      // depthNorm 0 = at outer edge of rough, 1 = deep toward center
      const outer = Math.max(...this.radii);
      const cutR = outer * (1 - depthNorm * 0.85);
      if (cutR >= current) continue;

      const next = Math.max(0.12, Math.min(current, cutR));
      const delta = current - next;
      if (delta < 0.001 * falloff) continue;

      // Soft clamp: allow slight overcut past target but flag it
      const floor = targetR * 0.82;
      let applied = next;
      if (next < floor) {
        applied = Math.max(floor * 0.92, next);
        overcut = true;
      }

      // Precision: how close to target we land
      const after = current - delta * falloff * (0.55 + this.cutStrength * 20);
      const finalR = Math.max(applied, Math.min(current, after));
      const removedHere = current - finalR;
      if (removedHere <= 0) continue;

      this.radii[i] = finalR;
      removed += removedHere;
      closestDelta = Math.min(closestDelta, Math.abs(finalR - targetR));
    }

    if (removed <= 0) return null;

    this.cutsThisRound += 1;
    this.updateGuide();

    const precision = closestDelta < 0.018
      ? 'perfect'
      : closestDelta < 0.04
        ? 'precision'
        : overcut
          ? 'deep'
          : 'ok';

    return { removed, precision, tooDeep: overcut };
  }

  /**
   * Straight saw cut: clip silhouette to keep the half-plane containing the center.
   * Points (x1,y1)-(x2,y2) are in stone-local units (same space as radii).
   */
  applyStraightCut(x1, y1, x2, y2) {
    if (this.phase !== 'cutting') return null;
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 0.08) return null;

    const centerSide = Shapes.lineSide(0, 0, x1, y1, x2, y2);
    if (centerSide === 0) return null; // line through center — refuse

    const n = Shapes.SEGMENTS;
    let removed = 0;
    let closestDelta = Infinity;
    let overcut = false;
    let hits = 0;

    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = this.radii[i];
      const px = Math.cos(ang) * r;
      const py = Math.sin(ang) * r;
      if (Shapes.lineSide(px, py, x1, y1, x2, y2) === centerSide) continue;

      const t = Shapes.rayLineIntersect(ang, x1, y1, x2, y2);
      if (t == null || t >= r) continue;

      const targetR = this.target[i];
      const floor = targetR * 0.82;
      let next = Math.max(0.12, t);
      if (next < floor) {
        next = Math.max(floor * 0.92, next);
        overcut = true;
      }
      if (next >= r) continue;

      const removedHere = r - next;
      this.radii[i] = next;
      removed += removedHere;
      closestDelta = Math.min(closestDelta, Math.abs(next - targetR));
      hits += 1;
    }

    if (removed <= 0 || hits < 2) return null;

    this.cutsThisRound += 1;
    this.updateGuide();

    const precision = closestDelta < 0.022
      ? 'perfect'
      : closestDelta < 0.05
        ? 'precision'
        : overcut
          ? 'deep'
          : 'ok';

    return { removed, precision, tooDeep: overcut, straight: true };
  }

  updateGuide() {
    const { shape } = this.liveScores();
    // Guide becomes more visible as player approaches target
    this.guideOpacity = Shapes.clamp(0.1 + (shape / 100) * 0.45, 0.1, 0.55);
  }

  canFinish() {
    // First round: finish after any real cut. Later: a few cuts or material down.
    if (this.roundsCompleted === 0) return this.cutsThisRound >= 1 || this.materialPct() < 99;
    return this.cutsThisRound >= 2 || this.materialPct() < 96;
  }

  finish() {
    const scores = this.liveScores();
    const shape = Math.round(scores.shape);
    const sym = Math.round(scores.sym);
    const mat = Math.round(scores.mat);
    const quality = Math.round(scores.quality);

    const rewards = this.calcRewards(shape, sym, mat, quality);
    this.coins += rewards.total;

    const excellent = quality >= 90;
    const master = quality >= 98;
    const perfect = quality >= 99.5 || (quality >= 97 && shape >= 98 && sym >= 97);

    if (quality >= 88) {
      this.streak += 1;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
    } else if (quality < 70) {
      this.streak = 0;
    }

    this.personalBest = Math.max(this.personalBest, quality);
    this.roundsCompleted += 1;
    this.phase = 'reveal';
    this.lastResult = {
      shape, sym, mat, quality,
      rewards,
      grade: this.gradeLabel(quality, perfect, master),
      perfect, master, excellent,
      cutName: this.cut.name,
      cutId: this.cut.id,
      stoneName: this.stone.name,
      stoneId: this.stone.id,
    };
    this.save();
    return this.lastResult;
  }

  gradeLabel(q, perfect, master) {
    if (perfect) return '💎 PERFECT CUT';
    if (master) return '✨ MASTER CUT';
    if (q >= 92) return '✨ EXCELLENT CUT';
    if (q >= 82) return 'PRECISION CUT';
    if (q >= 70) return 'FINE CUT';
    if (q >= 55) return 'SERVICEABLE CUT';
    return 'ROUGH CUT — TRY AGAIN';
  }

  calcRewards(shape, sym, mat, quality) {
    const parts = [];
    const base = 250;
    parts.push({ label: 'CUT COMPLETE', amount: base });

    let precisionBonus = 0;
    if (shape >= 95) precisionBonus = 180;
    else if (shape >= 90) precisionBonus = 120;
    else if (shape >= 80) precisionBonus = 60;
    if (precisionBonus) parts.push({ label: 'PRECISION BONUS', amount: precisionBonus });

    let matBonus = 0;
    if (mat >= 92) matBonus = 110;
    else if (mat >= 85) matBonus = 90;
    else if (mat >= 75) matBonus = 40;
    if (matBonus) parts.push({ label: 'MATERIAL BONUS', amount: matBonus });

    let symBonus = 0;
    if (sym >= 95) symBonus = 100;
    else if (sym >= 88) symBonus = 50;
    if (symBonus) parts.push({ label: 'SYMMETRY BONUS', amount: symBonus });

    if (quality >= 99) parts.push({ label: 'PERFECT CUT', amount: 300 });
    else if (quality >= 98) parts.push({ label: 'MASTER CUT', amount: 200 });

    let streakBonus = 0;
    if (this.streak >= 3 && quality >= 88) {
      streakBonus = 40 * Math.min(this.streak, 10);
      parts.push({ label: `STREAK x${this.streak}`, amount: streakBonus });
    }

    if (this.stone && this.stone.rarity >= 2) {
      parts.push({
        label: `${this.stone.short.toUpperCase()} BONUS`,
        amount: Math.round(40 * this.stone.rarity),
      });
    }

    const value = Math.round(
      (400 + quality * 18 + mat * 4) * (this.stone?.valueMul || 1)
    );
    const total = parts.reduce((s, p) => s + p.amount, 0);
    return { parts, total, value };
  }

  nextStone(preferredId) {
    // Occasionally offer picker (~ every 4 rounds after first)
    const offerPicker = !preferredId
      && this.roundsCompleted > 0
      && this.roundsCompleted % 4 === 0;
    if (offerPicker) {
      this.phase = 'picker';
      return { picker: true };
    }
    this.startRound(preferredId);
    return { picker: false };
  }

  chooseShape(id, stoneId) {
    this.startRound(id, stoneId);
  }
}

window.CutGame = CutGame;


/** Canvas gemstone renderer — rough & polished diamond visuals */

const GemRender = (() => {
  let canvas, ctx;
  let w = 720, h = 720;
  let reducedMotion = false;
  let idleAngle = 0;
  let shake = 0;
  let polishT = 0; // 0 rough → 1 polished (reveal)
  let sparkles = [];
  let lastTs = 0;
  let running = false;
  let gameRef = null;

  function init(cvs, game) {
    canvas = cvs;
    ctx = canvas.getContext('2d');
    gameRef = game;
    reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();
    window.addEventListener('resize', resize);
    running = true;
    lastTs = performance.now();
    requestAnimationFrame(loop);
  }

  function resize() {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, Math.floor(rect.width * dpr));
    h = Math.max(1, Math.floor(rect.height * dpr));
    canvas.width = w;
    canvas.height = h;
  }

  function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (!reducedMotion && gameRef?.phase === 'cutting') {
      idleAngle += dt * 0.15;
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 8);
    if (polishT > 0 && polishT < 1) {
      polishT = Math.min(1, polishT + dt * 0.85);
    }
    updateSparkles(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function bump(amount = 1) {
    shake = Math.min(2.5, shake + amount);
  }

  function setPolish(t) {
    polishT = t;
  }

  function addSparkles(cx, cy, n = 8) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 80;
      sparkles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.35 + Math.random() * 0.25,
        max: 0.5,
        size: 1.5 + Math.random() * 2.5,
      });
    }
  }

  function updateSparkles(dt) {
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 30 * dt;
      if (s.life <= 0) sparkles.splice(i, 1);
    }
  }

  function draw() {
    if (!ctx || !gameRef) return;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2 + h * 0.02;
    const baseScale = Math.min(w, h) * 0.38 * (gameRef.zoom || 1);

    const rot = (gameRef.rotation || 0) + (reducedMotion ? 0 : idleAngle);
    const sx = (Math.random() - 0.5) * shake * 3;
    const sy = (Math.random() - 0.5) * shake * 3;

    // Soft ground shadow
    drawShadow(cx + sx, cy + sy + baseScale * 0.55, baseScale);

    ctx.save();
    ctx.translate(cx + sx, cy + sy);
    ctx.rotate(rot);

    // Target guide (behind stone)
    drawGuide(gameRef.target, baseScale, gameRef.guideOpacity || 0.15);

    // Diamond body
    const radii = gameRef.radii;
    if (polishT > 0.5) {
      drawPolished(radii, baseScale, polishT);
    } else {
      drawRough(radii, baseScale, polishT);
      if (polishT > 0) {
        ctx.globalAlpha = polishT * 2;
        drawPolished(radii, baseScale, 1);
        ctx.globalAlpha = 1;
      }
    }

    // Straight-cut saw preview (local space)
    if (gameRef.straightPreview) {
      drawStraightPreview(gameRef.straightPreview, baseScale);
    }

    ctx.restore();

    // Screen-space sparkles
    for (const s of sparkles) {
      const a = s.life / s.max;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 250, 235, ${a})`;
      ctx.arc(s.x, s.y, s.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawShadow(x, y, scale) {
    const grd = ctx.createRadialGradient(x, y, scale * 0.1, x, y, scale * 0.75);
    grd.addColorStop(0, 'rgba(60, 42, 20, 0.22)');
    grd.addColorStop(1, 'rgba(60, 42, 20, 0)');
    ctx.beginPath();
    ctx.ellipse(x, y, scale * 0.72, scale * 0.18, 0, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  function pathFromRadii(radii, scale) {
    ctx.beginPath();
    for (let i = 0; i < radii.length; i++) {
      const ang = (i / radii.length) * Math.PI * 2 - Math.PI / 2;
      const r = radii[i] * scale;
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function palette() {
    return (gameRef?.stone?.colors) || Shapes.STONE_DEFS[0].colors;
  }

  function drawStraightPreview(preview, scale) {
    const { x1, y1, x2, y2 } = preview;
    ctx.save();
    ctx.strokeStyle = 'rgba(184, 146, 62, 0.9)';
    ctx.lineWidth = Math.max(2, scale * 0.016);
    ctx.setLineDash([scale * 0.05, scale * 0.035]);
    ctx.beginPath();
    ctx.moveTo(x1 * scale, y1 * scale);
    ctx.lineTo(x2 * scale, y2 * scale);
    ctx.stroke();
    ctx.setLineDash([]);
    // End caps
    for (const [x, y] of [[x1, y1], [x2, y2]]) {
      ctx.beginPath();
      ctx.arc(x * scale, y * scale, scale * 0.028, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212, 168, 75, 0.95)';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGuide(target, scale, opacity) {
    if (!target) return;
    ctx.save();
    ctx.globalAlpha = opacity;
    pathFromRadii(target, scale);
    ctx.strokeStyle = 'rgba(184, 146, 62, 0.85)';
    ctx.lineWidth = Math.max(1.2, scale * 0.012);
    ctx.setLineDash([scale * 0.04, scale * 0.03]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = opacity * 0.25;
    ctx.fillStyle = 'rgba(212, 168, 75, 0.35)';
    ctx.fill();
    ctx.restore();
  }

  function drawRough(radii, scale, polish) {
    const c = palette();

    ctx.beginPath();
    ctx.ellipse(0, scale * 0.08, scale * 0.78, scale * 0.72, 0, 0, Math.PI * 2);
    const depth = ctx.createRadialGradient(0, 0, scale * 0.2, 0, scale * 0.1, scale * 0.85);
    depth.addColorStop(0, c.glow);
    depth.addColorStop(1, 'rgba(80, 100, 120, 0)');
    ctx.fillStyle = depth;
    ctx.fill();

    pathFromRadii(radii, scale);
    const body = ctx.createRadialGradient(
      -scale * 0.22, -scale * 0.3, scale * 0.04,
      scale * 0.1, scale * 0.15, scale * 1.05
    );
    body.addColorStop(0, c.hi);
    body.addColorStop(0.28, c.mid);
    body.addColorStop(0.7, c.mid);
    body.addColorStop(1, c.deep);
    ctx.fillStyle = body;
    ctx.fill();

    const n = radii.length;
    const step = Math.max(2, Math.floor(n / 14));
    for (let i = 0; i < n; i += step) {
      const i2 = (i + step) % n;
      const a0 = (i / n) * Math.PI * 2 - Math.PI / 2;
      const a1 = (i2 / n) * Math.PI * 2 - Math.PI / 2;
      const r0 = radii[i] * scale;
      const r1 = radii[i2] * scale;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a0) * r0, Math.sin(a0) * r0);
      ctx.lineTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
      ctx.closePath();
      const bright = (Math.sin(a0 * 2.3 + idleAngle) + 1) * 0.5;
      const cool = (Math.cos(a0 * 1.7) + 1) * 0.5;
      ctx.fillStyle = bright > 0.55
        ? `rgba(255,255,255,${0.1 + bright * 0.22})`
        : `rgba(${c.cool},${0.06 + cool * 0.14})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255, ${0.12 + bright * 0.18})`;
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let i = 0; i < n; i += Math.max(1, Math.floor(n / 8))) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = radii[i] * scale * 0.42;
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    pathFromRadii(radii, scale);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = Math.max(2, scale * 0.018);
    ctx.stroke();
    ctx.strokeStyle = `rgba(${c.rim}, 0.45)`;
    ctx.lineWidth = Math.max(1, scale * 0.008);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-scale * 0.2, -scale * 0.3, scale * 0.26, scale * 0.16, -0.55, 0, Math.PI * 2);
    const hl = ctx.createRadialGradient(
      -scale * 0.2, -scale * 0.3, 0,
      -scale * 0.2, -scale * 0.3, scale * 0.26
    );
    hl.addColorStop(0, 'rgba(255,255,255,0.85)');
    hl.addColorStop(0.45, 'rgba(255,255,255,0.25)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fill();

    ctx.save();
    pathFromRadii(radii, scale);
    ctx.clip();
    for (let k = 0; k < 6; k++) {
      const ang = -0.9 + k * 0.32 + idleAngle * 0.35;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * scale * 0.08, Math.sin(ang) * scale * 0.08);
      ctx.lineTo(Math.cos(ang) * scale * 0.92, Math.sin(ang) * scale * 0.92);
      ctx.strokeStyle = `rgba(255,255,255,${0.07 + k * 0.025})`;
      ctx.lineWidth = 1.2 + k * 0.25;
      ctx.stroke();
    }
    const glint = ctx.createRadialGradient(
      scale * 0.25, -scale * 0.1, 0,
      scale * 0.25, -scale * 0.1, scale * 0.3
    );
    glint.addColorStop(0, 'rgba(255,255,255,0.22)');
    glint.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glint;
    ctx.fillRect(-scale, -scale, scale * 2, scale * 2);
    ctx.restore();
  }

  function drawPolished(radii, scale, intensity) {
    const c = palette();
    pathFromRadii(radii, scale);
    const body = ctx.createRadialGradient(
      -scale * 0.15, -scale * 0.2, scale * 0.02,
      0, 0, scale
    );
    body.addColorStop(0, '#ffffff');
    body.addColorStop(0.25, c.hi);
    body.addColorStop(0.55, c.mid);
    body.addColorStop(0.85, c.mid);
    body.addColorStop(1, c.deep);
    ctx.fillStyle = body;
    ctx.fill();

    const n = radii.length;
    const table = 0.38;
    ctx.beginPath();
    for (let i = 0; i < n; i += Math.max(1, Math.floor(n / 8))) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = radii[i] * scale * table;
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();

    for (let i = 0; i < n; i += Math.max(1, Math.floor(n / 12))) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = radii[i] * scale;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * r * table, Math.sin(ang) * r * table);
      ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      ctx.closePath();
      const lit = (Math.cos(ang + idleAngle * 2) + 1) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${0.05 + lit * 0.22 * intensity})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${c.cool}, ${0.2 + lit * 0.25})`;
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }

    pathFromRadii(radii, scale);
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = Math.max(1.5, scale * 0.016);
    ctx.stroke();
    ctx.strokeStyle = `rgba(${c.rim}, 0.45)`;
    ctx.lineWidth = Math.max(1, scale * 0.008);
    ctx.stroke();

    ctx.save();
    pathFromRadii(radii, scale);
    ctx.clip();
    const hx = Math.cos(idleAngle * 1.5) * scale * 0.25;
    const hy = Math.sin(idleAngle * 1.2) * scale * 0.2 - scale * 0.15;
    const caustic = ctx.createRadialGradient(hx, hy, 0, hx, hy, scale * 0.35);
    caustic.addColorStop(0, `rgba(255,255,255,${0.55 * intensity})`);
    caustic.addColorStop(0.4, c.glow);
    caustic.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = caustic;
    ctx.fillRect(-scale, -scale, scale * 2, scale * 2);

    if (intensity > 0.7) {
      drawCrossSparkle(hx * 0.5, hy * 0.5, scale * 0.35, intensity);
    }
    ctx.restore();
  }

  function drawCrossSparkle(x, y, size, intensity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(idleAngle);
    const g = ctx.createLinearGradient(-size, 0, size, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, `rgba(255,255,255,${0.85 * intensity})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-size, -1.5, size * 2, 3);
    ctx.rotate(Math.PI / 2);
    ctx.fillRect(-size * 0.7, -1.2, size * 1.4, 2.4);
    ctx.restore();
  }

  /** Screen coords → stone-local polar */
  function screenToLocal(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const dpr = w / rect.width;
    const sx = (clientX - rect.left) * dpr;
    const sy = (clientY - rect.top) * dpr;
    const cx = w / 2;
    const cy = h / 2 + h * 0.02;
    const baseScale = Math.min(w, h) * 0.38 * (gameRef.zoom || 1);
    const rot = (gameRef.rotation || 0) + (reducedMotion ? 0 : idleAngle);

    let x = sx - cx;
    let y = sy - cy;
    // inverse rotate
    const cos = Math.cos(-rot);
    const sin = Math.sin(-rot);
    const lx = x * cos - y * sin;
    const ly = x * sin + y * cos;
    const dist = Math.sqrt(lx * lx + ly * ly);
    const ang = Math.atan2(ly, lx);
    const normR = dist / baseScale;
    return { ang, normR, dist, baseScale, sx, sy, lx, ly };
  }

  function getCanvasPoint(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: clientX - rect.left,
      y: clientY - rect.top,
    };
  }

  /** Mini polished gem for reveal card */
  function paintReveal(targetCanvas, radii, cutId) {
    const c = targetCanvas.getContext('2d');
    const size = targetCanvas.width;
    c.clearRect(0, 0, size, size);
    const cx = size / 2;
    const cy = size / 2;
    const scale = size * 0.42;
    const pal = palette();

    c.beginPath();
    c.ellipse(cx, cy + scale * 0.55, scale * 0.65, scale * 0.16, 0, 0, Math.PI * 2);
    c.fillStyle = 'rgba(60,42,20,0.2)';
    c.fill();

    c.save();
    c.translate(cx, cy);
    const n = radii.length;
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = radii[i] * scale / 0.72;
      const x = Math.cos(ang) * Math.min(r, scale);
      const y = Math.sin(ang) * Math.min(r, scale);
      if (i === 0) c.moveTo(x, y);
      else c.lineTo(x, y);
    }
    c.closePath();
    const body = c.createRadialGradient(-scale * 0.2, -scale * 0.2, 0, 0, 0, scale);
    body.addColorStop(0, '#fff');
    body.addColorStop(0.35, pal.hi);
    body.addColorStop(0.65, pal.mid);
    body.addColorStop(1, pal.deep);
    c.fillStyle = body;
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.7)';
    c.lineWidth = 2;
    c.stroke();

    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(Math.cos(ang) * scale * 0.95, Math.sin(ang) * scale * 0.95);
      c.strokeStyle = 'rgba(255,255,255,0.25)';
      c.lineWidth = 1;
      c.stroke();
    }
    c.restore();
  }

  return {
    init, resize, bump, setPolish, addSparkles,
    screenToLocal, getCanvasPoint, paintReveal,
    get size() { return { w, h }; },
  };
})();

window.GemRender = GemRender;


/** UI — cutting, rotate, zoom, reveal, picker */

const CutUI = (() => {
  const els = {};
  let game = null;
  let reducedMotion = false;
  let pointer = null;
  let lastCutTs = 0;
  let hintHidden = false;

  function $(id) { return document.getElementById(id); }

  function init(g) {
    game = g;
    reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    cacheEls();
    GemRender.init(els.gemCanvas, game);
    bind();
    buildPicker();
    renderHud();
    updateModeUI();
  }

  function cacheEls() {
    [
      'gemCanvas', 'fxLayer', 'toastLayer', 'precisionBanner', 'cutterCursor',
      'stage', 'stageHint', 'targetPreview', 'targetName', 'materialValue',
      'materialFill', 'coinValue', 'soundBtn', 'soundIcon', 'streakChip',
      'streakValue', 'bestChip', 'bestValue', 'btnCut', 'btnStraight', 'btnRotate', 'btnZoom',
      'btnFinish', 'revealOverlay', 'revealCard', 'revealGem', 'revealTitle',
      'revealStone', 'revealGrade', 'revealMatch', 'revealMaterial', 'revealSymmetry',
      'revealValue', 'revealRewards', 'btnNext', 'btnChoose', 'pickerOverlay',
      'shapeGrid', 'btnPickerClose', 'stoneName', 'targetLabel',
    ].forEach((id) => { els[id] = $(id); });
  }

  function bind() {
    els.soundBtn.addEventListener('click', () => {
      CutAudio.unlock();
      const m = CutAudio.toggleMute();
      els.soundIcon.textContent = m ? '✕' : '♪';
      els.soundBtn.classList.toggle('muted', m);
      CutAudio.tap();
    });
    els.soundIcon.textContent = CutAudio.isMuted() ? '✕' : '♪';
    els.soundBtn.classList.toggle('muted', CutAudio.isMuted());

    document.body.addEventListener('pointerdown', () => CutAudio.unlock(), { once: true });

    ['btnCut', 'btnStraight', 'btnRotate', 'btnZoom'].forEach((id) => {
      els[id].addEventListener('click', () => {
        CutAudio.unlock();
        CutAudio.tap();
        game.mode = els[id].dataset.mode;
        game.straightPreview = null;
        updateModeUI();
      });
    });

    els.btnFinish.addEventListener('click', () => {
      CutAudio.unlock();
      if (!game.canFinish()) {
        toast('Make a few cuts first');
        CutAudio.tap();
        return;
      }
      finishRound();
    });

    els.btnNext.addEventListener('click', () => {
      CutAudio.unlock();
      CutAudio.tap();
      hideReveal();
      const r = game.nextStone();
      if (r.picker) showPicker();
      else beginCutting();
    });

    els.btnChoose.addEventListener('click', () => {
      CutAudio.unlock();
      CutAudio.tap();
      hideReveal();
      showPicker();
    });

    els.btnPickerClose.addEventListener('click', () => {
      CutAudio.unlock();
      CutAudio.tap();
      hidePicker();
      game.startRound();
      beginCutting();
    });

    const stage = els.stage;
    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  function updateModeUI() {
    ['cut', 'straight', 'rotate', 'zoom'].forEach((m) => {
      const btn = document.querySelector(`.tool[data-mode="${m}"]`);
      if (btn) btn.classList.toggle('active', game.mode === m);
    });
    els.stage.classList.remove('mode-cut', 'mode-straight', 'mode-rotate', 'mode-zoom');
    els.stage.classList.add(`mode-${game.mode}`);
    els.cutterCursor.classList.toggle('straight-mode', game.mode === 'straight');
    const hints = {
      cut: 'Drag across the stone to shave with the wheel',
      straight: 'Drag a straight line to saw a flat facet',
      rotate: 'Drag horizontally to inspect',
      zoom: 'Drag up/down to zoom',
    };
    if (!hintHidden) els.stageHint.textContent = hints[game.mode] || hints.cut;
  }

  function onDown(e) {
    if (game.phase !== 'cutting') return;
    CutAudio.unlock();
    els.stage.setPointerCapture?.(e.pointerId);
    pointer = {
      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      mode: game.mode,
      lastAng: null,
    };
    els.stage.classList.add('dragging');
    if (game.mode === 'cut') {
      showCutter(e.clientX, e.clientY);
      doCut(e.clientX, e.clientY);
    } else if (game.mode === 'straight') {
      const local = GemRender.screenToLocal(e.clientX, e.clientY);
      pointer.sx = local.lx / local.baseScale;
      pointer.sy = local.ly / local.baseScale;
      game.straightPreview = {
        x1: pointer.sx, y1: pointer.sy,
        x2: pointer.sx, y2: pointer.sy,
      };
      showCutter(e.clientX, e.clientY);
    }
    hideHintSoon();
  }

  function onMove(e) {
    if (!pointer || e.pointerId !== pointer.id) return;
    if (pointer.mode === 'cut') {
      showCutter(e.clientX, e.clientY);
      const steps = Math.max(1, Math.ceil(dist(pointer.x, pointer.y, e.clientX, e.clientY) / 8));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const x = pointer.x + (e.clientX - pointer.x) * t;
        const y = pointer.y + (e.clientY - pointer.y) * t;
        doCut(x, y);
      }
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    } else if (pointer.mode === 'straight') {
      showCutter(e.clientX, e.clientY);
      const local = GemRender.screenToLocal(e.clientX, e.clientY);
      game.straightPreview = {
        x1: pointer.sx,
        y1: pointer.sy,
        x2: local.lx / local.baseScale,
        y2: local.ly / local.baseScale,
      };
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    } else if (pointer.mode === 'rotate') {
      const dx = e.clientX - pointer.x;
      game.rotation += dx * 0.01;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    } else if (pointer.mode === 'zoom') {
      const dy = e.clientY - pointer.y;
      game.zoom = Shapes.clamp(game.zoom - dy * 0.004, 0.75, 1.35);
      pointer.y = e.clientY;
      pointer.x = e.clientX;
    }
  }

  function onUp(e) {
    if (!pointer || (e.pointerId !== undefined && e.pointerId !== pointer.id)) return;
    if (pointer.mode === 'straight' && game.straightPreview) {
      const p = game.straightPreview;
      const result = game.applyStraightCut(p.x1, p.y1, p.x2, p.y2);
      game.straightPreview = null;
      if (result) {
        GemRender.bump(1.2);
        renderHud();
        const midX = (pointer.x + (e.clientX || pointer.x)) / 2;
        const midY = (pointer.y + (e.clientY || pointer.y)) / 2;
        const pt = GemRender.getCanvasPoint(midX, midY);
        spawnFragments(pt.x, pt.y, result.removed * 1.4);
        CutAudio.cut(0.85);
        CutAudio.tink();
        feedbackCut(result);
      } else {
        toast('Draw a longer straight cut');
        CutAudio.tap();
      }
    }
    pointer = null;
    els.stage.classList.remove('dragging');
    hideCutter();
    game.straightPreview = null;
  }

  function doCut(clientX, clientY) {
    const now = performance.now();
    if (now - lastCutTs < 16) return; // ~60fps throttle

    const local = GemRender.screenToLocal(clientX, clientY);
    // Only cut near/on the stone
    const maxR = Math.max(...game.radii) * 1.08;
    if (local.normR > maxR || local.normR < 0.15) return;

    // Depth: how far from outer edge toward center
    const outer = Math.max(...game.radii);
    const depthNorm = Shapes.clamp((outer - local.normR) / outer + 0.15, 0, 1);

    const result = game.applyCut(local.ang, depthNorm, 4);
    if (!result) return;

    lastCutTs = now;
    GemRender.bump(0.6);
    renderHud();

    const pt = GemRender.getCanvasPoint(clientX, clientY);
    spawnFragments(pt.x, pt.y, result.removed);
    GemRender.addSparkles(
      local.sx || clientX,
      local.sy || clientY,
      4 + Math.min(8, Math.floor(result.removed * 40))
    );

    // Audio feedback
    CutAudio.cut(Math.min(1, result.removed * 8));
    if (Math.random() < 0.45) CutAudio.tink();

    feedbackCut(result);

    // Auto-nudge: if very close after enough cuts, gently encourage finish
    const scores = game.liveScores();
    if (game.cutsThisRound >= 8 && scores.quality >= 88) {
      els.stageHint.textContent = 'Looking sharp — tap Finish';
      els.stageHint.classList.remove('hide');
    }
  }

  function feedbackCut(result) {
    if (result.precision === 'perfect') {
      showPrecision('💎 PERFECT CUT');
      CutAudio.perfectCut();
    } else if (result.precision === 'precision') {
      showPrecision('✨ PRECISION CUT');
      CutAudio.precision();
    } else if (result.tooDeep) {
      showPrecision('⚠️ TOO DEEP', true);
      CutAudio.tooDeep();
    } else if (result.straight) {
      showPrecision('▬ STRAIGHT CUT');
    }
  }

  function showCutter(cx, cy) {
    const rect = els.stage.getBoundingClientRect();
    els.cutterCursor.hidden = false;
    els.cutterCursor.style.left = `${cx - rect.left}px`;
    els.cutterCursor.style.top = `${cy - rect.top}px`;
  }
  function hideCutter() {
    els.cutterCursor.hidden = true;
  }

  function spawnFragments(x, y, amount) {
    if (reducedMotion) return;
    const fragColor = game.stone?.colors?.frag || '#c8d8ec';
    const n = 4 + Math.min(10, Math.floor(amount * 50));
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'frag';
      el.style.background = `linear-gradient(145deg, #fff, ${fragColor})`;
      const ang = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 50;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
      el.style.setProperty('--dy', `${Math.sin(ang) * dist}px`);
      el.style.setProperty('--rot', `${Math.random() * 180}deg`);
      els.fxLayer.appendChild(el);
      setTimeout(() => el.remove(), 560);
    }
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const ang = Math.random() * Math.PI * 2;
      const dist = 12 + Math.random() * 28;
      s.style.left = `${x}px`;
      s.style.top = `${y}px`;
      s.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
      s.style.setProperty('--dy', `${Math.sin(ang) * dist}px`);
      els.fxLayer.appendChild(s);
      setTimeout(() => s.remove(), 420);
    }
  }

  function showPrecision(text, warn = false) {
    els.precisionBanner.hidden = false;
    els.precisionBanner.textContent = text;
    els.precisionBanner.classList.toggle('warn', warn);
    els.precisionBanner.classList.remove('pop');
    void els.precisionBanner.offsetWidth;
    els.precisionBanner.classList.add('pop');
    clearTimeout(showPrecision._t);
    showPrecision._t = setTimeout(() => {
      els.precisionBanner.hidden = true;
    }, 700);
  }

  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    els.toastLayer.appendChild(t);
    setTimeout(() => t.remove(), 1100);
  }

  function hideHintSoon() {
    if (hintHidden) return;
    hintHidden = true;
    setTimeout(() => els.stageHint.classList.add('hide'), 1200);
  }

  function renderHud() {
    els.targetName.textContent = game.cut.name;
    els.stoneName.textContent = game.stone.name;
    if (els.targetLabel) {
      els.targetLabel.textContent = `CUT THE ${game.stone.short.toUpperCase()}`;
    }
    els.targetPreview.innerHTML = Shapes.miniShapeSvg(game.cut.id, game.stone.id);
    const mat = game.materialPct();
    els.materialValue.textContent = `${mat}%`;
    els.materialFill.style.width = `${mat}%`;
    els.coinValue.textContent = String(game.coins);

    if (game.streak >= 2) {
      els.streakChip.hidden = false;
      els.streakValue.textContent = String(game.streak);
    } else {
      els.streakChip.hidden = true;
    }

    els.bestValue.textContent = game.personalBest
      ? `${Math.round(game.personalBest)}%`
      : '—';
  }

  function beginCutting() {
    game.phase = 'cutting';
    GemRender.setPolish(0);
    hintHidden = false;
    els.stageHint.classList.remove('hide');
    updateModeUI();
    renderHud();
  }

  function finishRound() {
    const result = game.finish();
    CutAudio.reveal();

    // Morph to polished
    GemRender.setPolish(0.01);
    requestAnimationFrame(() => GemRender.setPolish(1));

    setTimeout(() => showReveal(result), reducedMotion ? 200 : 550);
  }

  function showReveal(result) {
    els.revealOverlay.hidden = false;
    els.revealOverlay.setAttribute('aria-hidden', 'false');
    els.revealOverlay.classList.toggle('perfect', !!(result.perfect || result.master));

    els.revealTitle.textContent = result.cutName;
    if (els.revealStone) els.revealStone.textContent = result.stoneName || game.stone.name;
    els.revealGrade.textContent = result.grade;
    els.revealMatch.textContent = `${result.shape}%`;
    els.revealMaterial.textContent = `${result.mat}%`;
    els.revealSymmetry.textContent = `${result.sym}%`;
    els.revealValue.textContent = `+${result.rewards.value.toLocaleString()}`;

    // Reveal gem canvas
    els.revealGem.innerHTML = '';
    const cvs = document.createElement('canvas');
    cvs.width = 240;
    cvs.height = 240;
    els.revealGem.appendChild(cvs);
    GemRender.paintReveal(cvs, game.radii, result.cutId);

    // Reward chips
    els.revealRewards.innerHTML = '';
    result.rewards.parts.forEach((p, i) => {
      const chip = document.createElement('span');
      chip.className = 'reward-chip';
      chip.style.animationDelay = `${i * 0.06}s`;
      chip.textContent = `${p.label} +${p.amount}`;
      els.revealRewards.appendChild(chip);
    });

    if (result.perfect) CutAudio.master();
    else if (result.master) CutAudio.perfectCut();
    else if (result.excellent) CutAudio.success();
    else CutAudio.success();

    setTimeout(() => {
      CutAudio.coins();
      animateCoins(result.rewards.total);
    }, 300);

    renderHud();
  }

  function hideReveal() {
    els.revealOverlay.hidden = true;
    els.revealOverlay.setAttribute('aria-hidden', 'true');
    els.revealOverlay.classList.remove('perfect');
  }

  function animateCoins(amount) {
    if (reducedMotion) return;
    const n = Math.min(6, 2 + Math.floor(amount / 120));
    for (let i = 0; i < n; i++) {
      const f = document.createElement('div');
      f.className = 'float-coin';
      f.textContent = `+${Math.round(amount / n)}`;
      f.style.left = `${40 + Math.random() * 40}%`;
      f.style.top = `${50 + Math.random() * 10}%`;
      f.style.animationDelay = `${i * 50}ms`;
      els.toastLayer.appendChild(f);
      setTimeout(() => f.remove(), 900);
    }
  }

  function buildPicker() {
    els.shapeGrid.innerHTML = '';
    Shapes.CUT_DEFS.forEach((cut) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shape-option';
      btn.dataset.id = cut.id;
      const stoneId = game.stone?.id || Shapes.STONE_DEFS[0].id;
      btn.innerHTML = `${Shapes.miniShapeSvg(cut.id, stoneId)}<span>${cut.short}</span>`;
      btn.addEventListener('click', () => {
        CutAudio.unlock();
        CutAudio.tap();
        document.querySelectorAll('.shape-option').forEach((el) => {
          el.classList.toggle('selected', el === btn);
        });
        hidePicker();
        // Keep current stone or pick a fresh one for variety
        const stone = Shapes.pickStone(game.roundsCompleted);
        game.chooseShape(cut.id, stone.id);
        beginCutting();
      });
      els.shapeGrid.appendChild(btn);
    });
  }

  function showPicker() {
    game.phase = 'picker';
    buildPicker();
    els.pickerOverlay.hidden = false;
    els.pickerOverlay.setAttribute('aria-hidden', 'false');
    document.querySelectorAll('.shape-option').forEach((el) => {
      el.classList.toggle('selected', el.dataset.id === game.cut?.id);
    });
  }

  function hidePicker() {
    els.pickerOverlay.hidden = true;
    els.pickerOverlay.setAttribute('aria-hidden', 'true');
  }

  function dist(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    return Math.sqrt(dx * dx + dy * dy);
  }

  return { init, renderHud };
})();

window.CutUI = CutUI;


document.addEventListener('DOMContentLoaded', () => {
  const game = new CutGame();
  CutUI.init(game);
  window.__everstone = game;
});

// ── DEMO MODE ──────────────────────────────────────────────
// Set to false to disable auto-play
const DEMO_MODE = true;

// Mute audio when embedded in the arcade iframe
if (window !== window.top) {
  try { CutAudio.setMuted(true); } catch (_) {}
}

// Phase-tracking so we wait a sensible time in each state
let _demoPhase = null;
let _demoPhaseFrames = 0;
let _demoCutFrame = 0;

(function _demoLoop() {
  requestAnimationFrame(_demoLoop);
  if (!DEMO_MODE) return;
  const g = window.__everstone;
  if (!g) return;

  // Detect phase transitions and reset per-phase counter
  if (g.phase !== _demoPhase) {
    _demoPhase = g.phase;
    _demoPhaseFrames = 0;
  }
  _demoPhaseFrames++;

  if (g.phase === 'cutting') {
    _demoCutFrame++;
    // Apply one cut every 18 frames (~0.3 s at 60 fps)
    if (_demoCutFrame % 18 === 0) {
      _demoCutStep(g);
    }
    // After enough time and canFinish(), click the Finish button
    if (_demoPhaseFrames > 240 && g.canFinish()) {
      document.getElementById('btnFinish')?.click();
    }
  } else if (g.phase === 'reveal') {
    // Wait ~2.5 s then advance to next stone
    if (_demoPhaseFrames > 150) {
      document.getElementById('btnNext')?.click();
    }
  } else if (g.phase === 'picker') {
    // Wait ~1 s then dismiss picker (Surprise Me)
    if (_demoPhaseFrames > 60) {
      document.getElementById('btnPickerClose')?.click();
    }
  }
})();

/**
 * One AI cut step:
 * Finds the segment with the most excess material vs the target shape,
 * then applies a wheel cut aimed at that region.
 */
function _demoCutStep(game) {
  const n = Shapes.SEGMENTS;
  const radii  = game.radii;
  const target = game.target;

  // Find the segment with maximum excess material
  let maxExcess = 0;
  let bestIdx = 0;
  for (let i = 0; i < n; i++) {
    const excess = radii[i] - target[i];
    if (excess > maxExcess) {
      maxExcess = excess;
      bestIdx = i;
    }
  }

  // Nothing left to cut
  if (maxExcess < 0.008) return;

  // World angle for the worst segment
  const ang = (bestIdx / n) * Math.PI * 2 - Math.PI / 2;

  // Target cut depth: aim to remove ~60% of remaining excess each pass
  //   cutR = outer * (1 - depthNorm * 0.85)  →  depthNorm = (outer - cutR) / (outer * 0.85)
  const outer = Math.max(...radii);
  const desiredR = target[bestIdx] + (radii[bestIdx] - target[bestIdx]) * 0.4; // stop 40% above target
  const depthNorm = Shapes.clamp((outer - desiredR) / (outer * 0.85), 0.05, 0.92);

  game.applyCut(ang, depthNorm, 4);

  // Keep the HUD material bar in sync
  try { CutUI.renderHud(); } catch (_) {}
}
